name: Deploy to Firebase on Merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Sync GitHub Secrets to Firebase Secret Manager
        env:
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          set_secret() {
            local name=$1
            local value=$2
            if ! gcloud secrets describe "$name" --project="$PROJECT_ID" --quiet &>/dev/null; then
              echo "Creating secret: $name"
              gcloud secrets create "$name" \
                --project="$PROJECT_ID" \
                --replication-policy="automatic" \
                --quiet
            fi
            echo -n "$value" | gcloud secrets versions add "$name" \
              --project="$PROJECT_ID" \
              --data-file=- \
              --quiet
            echo "✓ $name synced"
          }
          set_secret "VITE_FIREBASE_API_KEY"             "$VITE_FIREBASE_API_KEY"
          set_secret "VITE_FIREBASE_AUTH_DOMAIN"         "$VITE_FIREBASE_AUTH_DOMAIN"
          set_secret "VITE_FIREBASE_PROJECT_ID"          "$VITE_FIREBASE_PROJECT_ID"
          set_secret "VITE_FIREBASE_STORAGE_BUCKET"      "$VITE_FIREBASE_STORAGE_BUCKET"
          set_secret "VITE_FIREBASE_MESSAGING_SENDER_ID" "$VITE_FIREBASE_MESSAGING_SENDER_ID"
          set_secret "VITE_FIREBASE_APP_ID"              "$VITE_FIREBASE_APP_ID"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Deploy to Firebase Hosting (Production)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
